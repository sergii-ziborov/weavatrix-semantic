[package]
name = "weavatrix-semantic"
version = "0.2.2"
edition = "2024"
rust-version = "1.88"
description = "Deterministic semantic linking for evidence-carrying Weavatrix graphs"
license = "MIT"
repository = "https://github.com/sergii-ziborov/weavatrix-semantic"
homepage = "https://weavatrix.com"
documentation = "https://docs.rs/weavatrix-semantic"
readme = "README.md"
publish = ["crates-io"]
keywords = ["graph", "semantic-search", "embeddings", "seo", "static-analysis"]
categories = ["algorithms", "data-structures"]

[features]
default = []
vector-search = ["dep:weavatrix-search-vector"]

[dependencies]
weavatrix-graph = "0.6.2"
weavatrix-search-vector = { version = "0.3.1", optional = true }

[[example]]
name = "vector_benchmark"
required-features = ["vector-search"]

[[example]]
name = "seo_benchmark"
required-features = ["vector-search"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
